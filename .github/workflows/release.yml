name: Release

# Builds the executable and the installer on a Windows runner and attaches
# them to a GitHub release.
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# or run it by hand from the Actions tab (workflow_dispatch).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.0 or v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $raw = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($raw)) { $raw = '${{ github.ref_name }}' }
          $v = $raw.Trim().TrimStart('v', 'V')
          if ($v -notmatch '^\d+\.\d+\.\d+') { throw "Bad version: $raw" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Check VERSION matches the tag
        shell: pwsh
        run: |
          $want = '${{ steps.ver.outputs.version }}'
          $have = (Get-Content VERSION -Raw).Trim()
          if ($have -ne $want) { throw "VERSION says $have but this release is $want. Bump VERSION and tag again." }

      - name: Build exe and installer
        shell: pwsh
        run: ./build_release.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Smoke test the executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AutoXtract.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "AutoXtract.exe exited immediately (code $($p.ExitCode))." }
          Stop-Process -Id $p.Id -Force
          Write-Host "AutoXtract.exe started and stayed running."

      - name: Smoke test the installer (silent, per-user, temp folder)
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'AutoXtractTest'
          $setup = Get-ChildItem dist\AutoXtract-*-Setup.exe | Select-Object -First 1
          $args = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER',
                    "/DIR=$target", '/LOG=' + (Join-Path $env:RUNNER_TEMP 'install.log'))
          $proc = Start-Process -FilePath $setup.FullName -ArgumentList $args -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer exited with $($proc.ExitCode)" }
          if (-not (Test-Path (Join-Path $target 'AutoXtract.exe'))) { throw "Installer did not place AutoXtract.exe" }
          $uninst = Get-ChildItem $target -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninst) { throw "No uninstaller was installed" }
          $u = Start-Process -FilePath $uninst.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Write-Host "Installed and uninstalled cleanly (uninstaller exit $($u.ExitCode))."

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoXtract-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Auto-Xtract ${{ steps.ver.outputs.version }}
          draft: true
          generate_release_notes: true
          body: |
            ## Install

            Download **AutoXtract-${{ steps.ver.outputs.version }}-Setup.exe** and run it.
            It installs to `Program Files`, adds a Start Menu entry and can be
            uninstalled from Apps & features like any other program.

            Prefer no installer? **AutoXtract-${{ steps.ver.outputs.version }}-win64.zip**
            holds the same portable executable.

            `.7z` and `.rar` need [7-Zip](https://7-zip.org); everything else works
            out of the box.

            Verify your download against `SHA256SUMS.txt`:
            `Get-FileHash .\AutoXtract-${{ steps.ver.outputs.version }}-Setup.exe -Algorithm SHA256`
          files: |
            dist/AutoXtract-${{ steps.ver.outputs.version }}-Setup.exe
            dist/AutoXtract-${{ steps.ver.outputs.version }}-win64.zip
            dist/SHA256SUMS.txt
